<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10">
<title>SciNET · Files</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/files.css">
</head>
<body><div class="app-shell">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">S</span><span class="brand-name">SCINET</span></a><div class="files-top-actions"><span class="top-status"><span class="status-dot"></span>LOCAL STORAGE</span><a class="button" href="/">← OVERVIEW</a></div></header>
<main class="files-page">
<section class="files-page-heading"><div><div class="section-kicker">STORAGE</div><h1>File manager</h1><p>Browse and manage files stored on this SciNET PC.</p></div><button class="button primary-action" id="newFolder">＋ NEW FOLDER</button></section>
<section class="files-toolbar card"><div class="breadcrumbs" id="breadcrumbs"><button class="crumb" data-path="">Shared files</button></div><div class="toolbar-actions"><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Search files and folders…" autocomplete="off"></label><button class="button view-toggle active" id="gridView" title="Grid view" aria-label="Grid view">▦</button><button class="button view-toggle" id="listView" title="List view" aria-label="List view">☷</button><button class="button" id="refreshFiles">↻</button></div></section>
<section class="files-summary"><span id="itemCount">Loading files…</span><span id="currentLocation">SHARED STORAGE</span></section>
<section class="file-browser card"><div class="file-grid" id="fileGrid"><div class="empty">Loading shared files…</div></div></section>
</main><footer>SCINET · LOCAL FILES</footer></div>
<div class="viewer-backdrop" id="viewer" hidden><section class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewerTitle"><header class="viewer-header"><div class="viewer-title-wrap"><span class="viewer-file-icon" id="viewerIcon">FILE</span><div><h2 id="viewerTitle">Preview</h2><p id="viewerMeta"></p></div></div><div class="viewer-actions"><button class="button" id="downloadCurrent">DOWNLOAD</button><button class="button" id="closeViewer" aria-label="Close preview">✕</button></div></header><div class="viewer-content" id="viewerContent"></div><footer class="editor-footer" id="editorFooter" hidden><span id="editorStatus">Unsaved changes</span><button class="button primary-action" id="saveText">SAVE CHANGES</button></footer></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/files.js"></script></body></html>
