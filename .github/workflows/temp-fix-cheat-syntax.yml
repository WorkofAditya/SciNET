name: Temporary Fix Cheat Syntax
on:
  push:
    branches: [feature/native-android-app]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra cheat-menu brace
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/workofaditya/scinet/ControllerScreen.kt')
          s = p.read_text()
          old = '''                            }
                                }
                            }
                            }
                        }
                        if (cheatStatus.isNotBlank()) {'''
          new = '''                            }
                                }
                            }
                        }
                        if (cheatStatus.isNotBlank()) {'''
          if old not in s:
              raise SystemExit('Target syntax block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/workofaditya/scinet/ControllerScreen.kt
          git commit -m "Fix cheat menu Compose syntax"
          git rm .github/workflows/temp-fix-cheat-syntax.yml
          git commit -m "Remove temporary syntax fix workflow"
          git push
