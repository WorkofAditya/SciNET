name: Android build

on:
  push:
    branches:
      - main
      - feature/native-android-app
      - feature/multi-device-peer-network
  pull_request:
    branches:
      - main
      - feature/multi-device-peer-network
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Python server syntax
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python server
        run: python -m py_compile server.py
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Gradle projects
        run: gradle projects
      - name: Build Android debug APK
        run: gradle :app:assembleDebug
